name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/web/client/package-lock.json
            src/infra/package-lock.json

      - name: Install Angular dependencies
        working-directory: src/web/client
        run: npm ci

      - name: Build Angular app
        working-directory: src/web/client
        run: npm run build

      - name: Install CDK dependencies
        working-directory: src/infra
        run: npm ci

      - name: CDK synth
        working-directory: src/infra
        run: npx cdk synth
