name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/web/client/package-lock.json
            src/infra/package-lock.json

      - name: Install Angular dependencies
        working-directory: src/web/client
        run: npm ci

      - name: Build Angular app
        working-directory: src/web/client
        run: npm run build

      - name: Install CDK dependencies
        working-directory: src/infra
        run: npm ci

      - name: CDK synth
        working-directory: src/infra
        run: npx cdk synth

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            src/infra/cdk.out
            src/web/client/dist

  deploy-dev:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: build
          path: src

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: src/infra
        run: npm ci

      - name: CDK deploy dev
        working-directory: src/infra
        run: |
          npx cdk deploy GarethDuncanDev-dev \
            --app cdk.out \
            --require-approval never \
            --parameters CloudFrontCertificateIdentifier=${{ vars.CDK_CLOUD_FRONT_CERTIFICATE_IDENTIFIER }} \
            --parameters HostedZoneId=${{ vars.CDK_HOSTED_ZONE_ID }}

  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    needs: build
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: build
          path: src

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: src/infra
        run: npm ci

      - name: CDK deploy prod
        working-directory: src/infra
        run: |
          npx cdk deploy GarethDuncanDev-prod \
            --app cdk.out \
            --require-approval never \
            --parameters CloudFrontCertificateIdentifier=${{ vars.CDK_CLOUD_FRONT_CERTIFICATE_IDENTIFIER }} \
            --parameters HostedZoneId=${{ vars.CDK_HOSTED_ZONE_ID }}
