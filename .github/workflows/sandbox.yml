name: Sandbox

on:
  push:
    branches: [sandbox/*]
  workflow_dispatch:
  delete:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/web/client/package-lock.json
            src/infra/package-lock.json

      - name: Install Angular dependencies
        working-directory: src/web/client
        run: npm ci

      - name: Build Angular app
        working-directory: src/web/client
        run: npm run build

      - name: Install CDK dependencies
        working-directory: src/infra
        run: npm ci

      - name: CDK synth
        working-directory: src/infra
        run: |
          SANDBOX_NAME=$(echo "${{ github.ref_name }}" | sed 's|sandbox/||' | tr '/' '-')
          npx cdk synth "GarethDuncanDev-${SANDBOX_NAME}" --context SANDBOX_NAME="${SANDBOX_NAME}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            src/infra/cdk.out
            src/web/client/dist

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: sandbox

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: build
          path: src

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: src/infra
        run: npm ci

      - name: CDK deploy sandbox
        working-directory: src/infra
        run: |
          SANDBOX_NAME=$(echo "${{ github.ref_name }}" | sed 's|sandbox/||' | tr '/' '-')
          npx cdk deploy "GarethDuncanDev-${SANDBOX_NAME}" \
            --app cdk.out \
            --require-approval never \
            --parameters CloudFrontCertificateIdentifier=${{ vars.CDK_CLOUD_FRONT_CERTIFICATE_IDENTIFIER }} \
            --parameters HostedZoneId=${{ vars.CDK_HOSTED_ZONE_ID }}

  destroy:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'sandbox/')
    runs-on: ubuntu-latest
    environment: sandbox

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: src/infra
        run: npm ci

      - name: CDK destroy sandbox
        working-directory: src/infra
        run: |
          SANDBOX_NAME=$(echo "${{ github.event.ref }}" | sed 's|sandbox/||' | tr '/' '-')
          npx cdk destroy "GarethDuncanDev-${SANDBOX_NAME}" \
            --context SANDBOX_NAME="${SANDBOX_NAME}" \
            --force
